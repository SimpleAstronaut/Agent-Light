[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-light"
version = "0.2.1"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["aiohttp>=3.11,<4", "pyserial==3.5", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
desktop = ["PySide6==6.10.3"]

[project.scripts]
agent-light = "agent_light.cli:main"

[project.gui-scripts]
agent-light-desktop = "agent_light.desktop.app:main"

[project.urls]
Repository = "https://github.com/SimpleAstronaut/Agent-Light"

[tool.setuptools.package-data]
agent_light = ["*.json", "integrations/templates/*.ps1"]
